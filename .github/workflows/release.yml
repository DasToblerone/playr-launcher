name: Release

# Pushing a tag like v1.6.0 builds the exe, signs it with SignPath (once it is set up) and attaches it to the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          rc /nologo SteamGameRandomizer.rc
          cl /nologo /EHsc /O2 /std:c++17 /utf-8 /W3 /MT SteamGameRandomizer.cpp /Fe:SteamGameRandomizer.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib advapi32.lib SteamGameRandomizer.res

      - name: Upload unsigned build
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: SteamGameRandomizer-unsigned
          path: SteamGameRandomizer.exe

      # Runs only after the SignPath organization id is stored as a repository variable.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: steam-game-randomizer
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick the file to publish
        shell: bash
        run: |
          mkdir -p dist
          signed=$(find signed -name SteamGameRandomizer.exe 2>/dev/null | head -n 1)
          cp "${signed:-SteamGameRandomizer.exe}" dist/SteamGameRandomizer.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/SteamGameRandomizer.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/SteamGameRandomizer.exe --title "$GITHUB_REF_NAME" --generate-notes
          fi
